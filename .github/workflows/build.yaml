name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron:  '0 9 * * *'
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0
        lfs: true

    - name: Install Lua
      uses: leafo/gh-actions-lua@v12

    # Ensure we're using the latest version of mise in an attempt to catch upstream errors early.
    - name: Get the latest mise version
      id: mise
      run: echo "version=$(curl -fsSL https://mise.jdx.dev/VERSION)" >> "$GITHUB_OUTPUT"

    - name: Install mise
      uses: jdx/mise-action@v4
      with:
        version: ${{ steps.mise.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build
      run:  |
        scripts/build.sh

    - name: Archive the binary
      uses: actions/upload-artifact@v6
      with:
        path: build/build.zip
        if-no-files-found: error
