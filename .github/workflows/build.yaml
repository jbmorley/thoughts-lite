name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron:  '0 9 * * *'
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    env:

      MISE_CACHE_DIR: ${{ github.workspace }}/.mise/cache
      MISE_CONFIG_DIR: ${{ github.workspace }}/.mise/config
      MISE_DATA_DIR: ${{ github.workspace }}/.mise/data
      MISE_STATE_DIR: ${{ github.workspace }}/.mise/state

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0
        lfs: true

    - name: Cache mise
      id: cache-mise
      uses: actions/cache@v6
      with:
        path: .mise
        key: ${{ runner.os }}-${{ runner.arch }}-mise-${{ hashFiles('mise.toml', '.github/workflows/build.yaml') }}

    - name: Install mise
      uses: jdx/mise-action@v5.3.0
      with:
        version: 2026.11.14
        cache: false

    - name: Build
      run:  |
        scripts/build.sh

    - name: Archive the binary
      uses: actions/upload-artifact@v7
      with:
        path: build/build.zip
        if-no-files-found: error
